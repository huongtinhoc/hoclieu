<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cô Hương Tin học</title><style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1c2333;--mu:#5b6478;--ac:#2f5bea;--acs:#e6edff;--ok:#16794a;--oks:#e1f4e9;--no:#b3261e;--nos:#fbe8e6;--bd:#e0e4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head><body><main><h1 style="margin:8px 0 4px;font-size:clamp(26px,6vw,36px)">Cô Hương Tin học</h1><p class="lead">Học liệu bài giảng theo từng bài. Tìm bài hoặc chọn cấp học của em.</p><input id="q" class="sb" type="search" placeholder="🔍 Tìm bài học, ví dụ: USB, hệ điều hành, thư mục…" autocomplete="off"><div id="res"></div><h3 class="sec">Chọn cấp học</h3><div class="grid"><a class="c" href="tieuhoc.html"><div style="font-size:32px">🎒</div><h2>Tiểu học</h2><p>3 bài: Phần cứng máy tính, Phần mềm máy tính, Tập tin và thư mục</p></a><div class="c"><div style="font-size:32px">💻</div><h2>THCS</h2><p>Sắp có bài giảng.</p></div></div></main><script>
const IDX=[{"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học", "u": "tieuhoc-bai-1-2.html", "x": "Bài 1-2 · Phần cứng máy tính Phần cứng là những thiết bị em có thể cầm, nắm và nhìn thấy. Bài này giúp em phân biệt thiết bị nhập, thiết bị xuất, thiết bị kết nối và thiết bị tích hợp."}, {"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học · 1. Khái niệm phần cứng (Hardware)", "u": "tieuhoc-bai-1-2.html#b0", "x": "Bài 1-2 · Phần cứng máy tính 1. Khái niệm phần cứng (Hardware) Phần cứng là các thiết bị mà chúng ta có thể cầm, nắm và nhìn thấy được. Màn hình Loa Tai nghe Micro Máy in Bàn phím Chuột "}, {"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học · 2. Thiết bị nhập (Input Device)", "u": "tieuhoc-bai-1-2.html#b1", "x": "Bài 1-2 · Phần cứng máy tính 2. Thiết bị nhập (Input Device) Là thiết bị giúp em gửi, đưa, truyền thông tin vào máy tính. Bàn phím (Keyboard) Chuột (Mouse) Máy quét (Scanner) Webcam Micro "}, {"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học · 3. Thiết bị xuất (Output Device)", "u": "tieuhoc-bai-1-2.html#b2", "x": "Bài 1-2 · Phần cứng máy tính 3. Thiết bị xuất (Output Device) Là thiết bị đưa kết quả xử lí của máy tính đến con người. Màn hình (Monitor) Loa (Speaker) Tai nghe (Headphone) Máy in (Printer) "}, {"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học · 4. Thiết bị kết nối", "u": "tieuhoc-bai-1-2.html#b3", "x": "Bài 1-2 · Phần cứng máy tính 4. Thiết bị kết nối Cổng HDMI, cổng VGA Kết nối với màn hình, máy chiếu và TV. Cổng kết nối mạng (Network ports) Kết nối với mạng bằng cáp có dây hoặc Wifi. Cổng USB (Universal Serial Bus) Kết nối với máy in, máy quét, máy ảnh, ổ đĩa Flash, bàn phím, chuột,… "}, {"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học · 5. Giao tiếp với AI", "u": "tieuhoc-bai-1-2.html#b4", "x": "Bài 1-2 · Phần cứng máy tính 5. Giao tiếp với AI Khi dùng AI, em cần thiết bị nhập để gửi yêu cầu và thiết bị xuất để nhận kết quả. Ví dụ: em gõ câu hỏi bằng bàn phím hoặc nói qua micro; AI trả lời bằng chữ trên màn hình hoặc âm thanh qua loa."}, {"t": "Bài 1-2 · Phần cứng máy tính", "s": "Tiểu học · 6. Thiết bị nhập tích hợp", "u": "tieuhoc-bai-1-2.html#b5", "x": "Bài 1-2 · Phần cứng máy tính 6. Thiết bị nhập tích hợp Màn hình cảm ứng (Touchscreen) Giúp tương tác với thiết bị bằng cách chạm ngón tay vào các vùng trên màn hình. Bộ tai nghe (Headset) Thiết bị tích hợp cả loa và micro. "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học", "u": "tieuhoc-bai-3-4.html", "x": "Bài 3-4 · Phần mềm máy tính Phần mềm là những chương trình do con người tạo ra để phục vụ nhu cầu sử dụng. Bài này giúp em phân loại phần mềm và hiểu về hệ điều hành."}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · 1. Khái niệm về phần mềm", "u": "tieuhoc-bai-3-4.html#b0", "x": "Bài 3-4 · Phần mềm máy tính 1. Khái niệm về phần mềm Phần mềm máy tính (Software) là những chương trình do trí tuệ con người tạo ra nhằm phục vụ cho mục đích sử dụng của con người. Microsoft PowerPoint Tạo bài trình chiếu. Microsoft Word Xử lí văn bản. Google Chrome Tìm kiếm thông tin trên Internet. "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · 2. Phân loại phần mềm", "u": "tieuhoc-bai-3-4.html#b1", "x": "Bài 3-4 · Phần mềm máy tính 2. Phân loại phần mềm Theo quyền hạn can thiệp vào mã nguồn: Phần mềm mã nguồn mở (Open Source) Người dùng được sử dụng miễn phí. Ví dụ: Linux. Phần mềm độc quyền (Proprietary) Được bán hoặc phân phối theo một loại giấy phép cụ thể. Ví dụ: Microsoft Windows, Microsoft Office. "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · Theo tính năng và môi trường sử dụng", "u": "tieuhoc-bai-3-4.html#b2", "x": "Bài 3-4 · Phần mềm máy tính Theo tính năng và môi trường sử dụng Chương trình ứng dụng Giúp em thực hiện các công việc cụ thể như soạn thảo văn bản, bảng tính, trình chiếu, vẽ (Word, Excel, PowerPoint, Paint). Ứng dụng Web Hoạt động trên Internet, phục vụ nhu cầu của em. "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · 3. Ứng dụng trên máy tính để bàn", "u": "tieuhoc-bai-3-4.html#b3", "x": "Bài 3-4 · Phần mềm máy tính 3. Ứng dụng trên máy tính để bàn Phải được cài đặt trên máy tính trước khi chạy. Khởi động Nhấp đúp vào biểu tượng lối tắt trên màn hình nền (Desktop), hoặc nhấp chuột phải vào biểu tượng trên Thanh tác vụ (Taskbar) rồi chọn Open. Thoát Nhấp vào nút X ở góc phải trên cùng của cửa sổ, hoặc nhấp chuột phải vào biểu tượng trên Taskbar rồi chọn Close/Exit. "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · Duyệt web: các thuật ngữ cần phân biệt", "u": "tieuhoc-bai-3-4.html#b4", "x": "Bài 3-4 · Phần mềm máy tính Duyệt web: các thuật ngữ cần phân biệt Trình duyệt Web (Web browser) Phần mềm dùng để xem mọi thứ trên Internet. Công cụ tìm kiếm (Search engine) Dùng để tìm thông tin trên Internet. Ví dụ: Google. Trang Web (Web page) Tài liệu có văn bản và hình ảnh em đọc trên Internet. Website Tập hợp các trang Web công khai, dùng chung một tên miền. "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · 4. Khái niệm hệ điều hành", "u": "tieuhoc-bai-3-4.html#b5", "x": "Bài 3-4 · Phần mềm máy tính 4. Khái niệm hệ điều hành Hệ điều hành là phần mềm giúp máy tính thực hiện một hoặc nhiều nhiệm vụ. Quản lí các tập tin lưu trữ trên máy tính Quản lí các thiết bị phần cứng "}, {"t": "Bài 3-4 · Phần mềm máy tính", "s": "Tiểu học · 5. Một số hệ điều hành thông dụng", "u": "tieuhoc-bai-3-4.html#b6", "x": "Bài 3-4 · Phần mềm máy tính 5. Một số hệ điều hành thông dụng Trên máy tính Windows, macOS (độc quyền); Linux (mã nguồn mở). Trên thiết bị di động Android (mã nguồn mở); iOS (độc quyền); ngoài ra còn có BlackBerry, Symbian. "}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học", "u": "tieuhoc-bai-5-6.html", "x": "Bài 5-6 · Tập tin và thư mục Em học cách đặt tên, nhận biết các kiểu tập tin phổ biến và quản lí tập tin bằng thư mục."}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học · 1. Tập tin (File)", "u": "tieuhoc-bai-5-6.html#b0", "x": "Bài 5-6 · Tập tin và thư mục 1. Tập tin (File) Là sản phẩm em tạo ra từ một chương trình phần mềm, sau đó đặt tên và lưu trữ vào máy tính. Đặt tên dễ phân loại, dễ tìm kiếm Lưu vào ổ cứng, ổ USB,… "}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học · Tên tập tin", "u": "tieuhoc-bai-5-6.html#b1", "x": "Bài 5-6 · Tập tin và thư mục Tên tập tin Gồm 2 phần: phần tên (do người đặt) và phần mở rộng (xác định loại tập tin), cách nhau bởi dấu chấm. Ví dụ: baitap.docx Tên tập tin không dài quá 255 kí tự và không dùng các kí tự \\ / : * ? “ | ."}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học · Các kiểu tập tin phổ biến", "u": "tieuhoc-bai-5-6.html#b2", "x": "Bài 5-6 · Tập tin và thư mục Các kiểu tập tin phổ biến Văn bản .doc (MS Word 2003), .docx (MS Word 2007), .pdf (Adobe Reader), .rtf (WordPad). Video, Âm thanh Có nhiều định dạng, ví dụ .mp4, .mp3. Nén .rar (WinRAR), .zip . Nén giúp giảm dung lượng lưu trữ. Chương trình Tập tin dùng để chạy phần mềm, ví dụ .exe. "}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học · 2. Thư mục (Folder)", "u": "tieuhoc-bai-5-6.html#b3", "x": "Bài 5-6 · Tập tin và thư mục 2. Thư mục (Folder) Là một dạng tập tin đặc biệt, như ngăn chứa để quản lí và sắp xếp các tập tin. Biểu tượng thư mục thường màu vàng. Thư mục gốc Không có thư mục cha, chứa tất cả các thư mục. Thư mục cha Thư mục chứa thư mục khác. Thư mục con Thư mục nằm trong thư mục khác. Thư mục rỗng Không chứa tập tin hay thư mục con nào. Các thư mục được sắp xếp theo dạng cây gọi là cây thư mục."}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học · Xem nội dung thư mục", "u": "tieuhoc-bai-5-6.html#b4", "x": "Bài 5-6 · Tập tin và thư mục Xem nội dung thư mục Nhấp đúp vào biểu tượng This PC trên Desktop, sau đó: Cách 1 Nhấp đúp vào thư mục cần xem. Cách 2 Nhấp chọn thư mục rồi nhấn Enter. "}, {"t": "Bài 5-6 · Tập tin và thư mục", "s": "Tiểu học · Các thao tác với thư mục", "u": "tieuhoc-bai-5-6.html#b5", "x": "Bài 5-6 · Tập tin và thư mục Các thao tác với thư mục Gợi ý thao tác trên Windows: Tạo mới Nhấp chuột phải vào vùng trống, chọn New → Folder. Đổi tên Chọn thư mục rồi nhấn F2. Xoá Chọn thư mục rồi nhấn Delete. Chọn nhiều mục Giữ Ctrl để chọn từng mục, giữ Shift để chọn liên tiếp. "}];
const nm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase();
IDX.forEach(e=>e.n=nm(e.x));
const q=document.getElementById("q"),res=document.getElementById("res");
q.addEventListener("input",()=>{const t=nm(q.value).split(/\s+/).filter(Boolean);
if(!t.length){res.innerHTML="";return}
const m=IDX.filter(e=>t.every(w=>e.n.includes(w))).slice(0,12);
res.innerHTML=m.length?m.map(e=>`<a href="${e.u}">${e.t}<small>${e.s}</small></a>`).join(""):'<p style="color:var(--mu)">Không tìm thấy bài phù hợp. Thử từ khoá khác nhé.</p>'});
</script></body></html>
